<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电商商品价格对比工具</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px;
        }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        .header h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .header p { font-size: 1.1rem; opacity: 0.9; }
        .search-box {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        .search-row {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        .search-input {
            flex: 1;
            padding: 14px 20px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
        }
        .search-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .search-btn {
            padding: 14px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .search-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4); }
        .search-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .platform-checks {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .platform-checks label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        .platform-checks input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
        .demo-btn {
            padding: 10px 20px;
            background: #f3f4f6;
            color: #4b5563;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        .demo-btn:hover { background: #e5e7eb; }
        .results { display: none; }
        .results.show { display: block; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
        }
        .stat-card .label { font-size: 14px; color: #6b7280; margin-bottom: 8px; }
        .stat-card .value { font-size: 28px; font-weight: 700; color: #111827; }
        .stat-card .value.red { color: #ef4444; }
        .stat-card .value.green { color: #10b981; }
        .highlight-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .highlight-card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-left: 5px solid;
        }
        .highlight-card.cheapest { border-color: #10b981; }
        .highlight-card.best-value { border-color: #f59e0b; }
        .highlight-card .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .highlight-card.cheapest .badge { background: #d1fae5; color: #065f46; }
        .highlight-card.best-value .badge { background: #fef3c7; color: #92400e; }
        .highlight-card h3 { font-size: 16px; margin-bottom: 8px; color: #111827; }
        .highlight-card .price { font-size: 32px; font-weight: 700; margin: 10px 0; }
        .highlight-card.cheapest .price { color: #10b981; }
        .highlight-card.best-value .price { color: #f59e0b; }
        .highlight-card .meta { font-size: 13px; color: #6b7280; }
        .chart-section {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }
        .chart-section h2 { font-size: 18px; margin-bottom: 20px; color: #111827; }
        .chart-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
        }
        .chart-container {
            position: relative;
            height: 300px;
        }
        .product-list {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .product-list h2 { font-size: 18px; margin-bottom: 20px; color: #111827; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #f3f4f6; }
        th { background: #f9fafb; font-weight: 600; font-size: 13px; color: #6b7280; }
        tr:hover { background: #f9fafb; }
        .platform-tag {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            color: white;
        }
        .platform-京东 { background: #e1251b; }
        .platform-淘宝 { background: #ff4400; }
        .platform-拼多多 { background: #e02e24; }
        .recommend-tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            margin-left: 6px;
        }
        .recommend-cheapest { background: #d1fae5; color: #065f46; }
        .recommend-best { background: #fef3c7; color: #92400e; }
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
        }
        .spinner {
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 4px solid #e5e7eb;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .initial-demo {
            background: white;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .initial-demo h2 { margin-bottom: 15px; color: #111827; }
        .initial-demo p { color: #6b7280; margin-bottom: 20px; }
        .rating-stars { color: #fbbf24; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛒 电商商品价格对比工具</h1>
            <p>一键对比京东、淘宝、拼多多商品价格，智能推荐性价比之选</p>
        </div>

        <div class="search-box">
            <div class="search-row">
                <input type="text" class="search-input" id="keywordInput"
                       placeholder="输入商品关键词，如：手机、耳机、笔记本..." value="手机">
                <button class="search-btn" id="searchBtn" onclick="doSearch()">开始对比</button>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;">
                <div class="platform-checks">
                    <label><input type="checkbox" value="京东" checked> 京东</label>
                    <label><input type="checkbox" value="淘宝" checked> 淘宝</label>
                    <label><input type="checkbox" value="拼多多" checked> 拼多多</label>
                </div>
                <button class="demo-btn" onclick="loadDemo()">📋 加载演示数据</button>
            </div>
        </div>

        <div id="initialDemo" class="initial-demo">
            <h2>👋 欢迎使用电商价格对比工具</h2>
            <p>输入关键词后点击"开始对比"，或点击"加载演示数据"查看示例效果</p>
            <button class="search-btn" onclick="loadDemo()">查看演示示例</button>
        </div>

        <div id="results" class="results"></div>
    </div>

    <script>
        let charts = {};

        function getPlatforms() {
            const checks = document.querySelectorAll('.platform-checks input:checked');
            return Array.from(checks).map(c => c.value);
        }

        function destroyCharts() {
            Object.values(charts).forEach(chart => {
                if (chart) chart.destroy();
            });
            charts = {};
        }

        async function doSearch() {
            const keyword = document.getElementById('keywordInput').value.trim();
            if (!keyword) {
                alert('请输入搜索关键词');
                return;
            }

            const btn = document.getElementById('searchBtn');
            btn.disabled = true;
            btn.textContent = '采集中...';

            const resultsDiv = document.getElementById('results');
            const initialDiv = document.getElementById('initialDemo');
            initialDiv.style.display = 'none';
            resultsDiv.classList.add('show');
            resultsDiv.innerHTML = '<div class="loading"><div class="spinner"></div><p>正在采集商品数据，请稍候...</p></div>';

            try {
                const resp = await fetch('/api/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        keyword: keyword,
                        platforms: getPlatforms(),
                        max_results: 15,
                        use_mock: true
                    })
                });

                const data = await resp.json();
                if (data.success) {
                    renderResults(data.result, data.charts);
                } else {
                    resultsDiv.innerHTML = `<div class="error">错误: ${data.error}</div>`;
                }
            } catch (e) {
                resultsDiv.innerHTML = `<div class="error">请求失败: ${e.message}</div>`;
            } finally {
                btn.disabled = false;
                btn.textContent = '开始对比';
            }
        }

        async function loadDemo() {
            const initialDiv = document.getElementById('initialDemo');
            const resultsDiv = document.getElementById('results');

            initialDiv.style.display = 'none';
            resultsDiv.classList.add('show');
            resultsDiv.innerHTML = '<div class="loading"><div class="spinner"></div><p>加载演示数据中...</p></div>';

            try {
                const resp = await fetch('/api/demo');
                const data = await resp.json();
                if (data.success) {
                    renderResults(data.result, null);
                } else {
                    doSearch();
                }
            } catch (e) {
                doSearch();
            }
        }

        function renderResults(result, chartData) {
            destroyCharts();
            const resultsDiv = document.getElementById('results');

            const cheapestId = result.cheapest ? result.cheapest.product_id : '';
            const bestId = result.best_value ? result.best_value.product_id : '';

            let statsHtml = `
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="label">商品总数</div>
                        <div class="value">${result.products.length}</div>
                    </div>
                    <div class="stat-card">
                        <div class="label">最低价</div>
                        <div class="value green">¥${result.price_range.min.toFixed(2)}</div>
                    </div>
                    <div class="stat-card">
                        <div class="label">最高价</div>
                        <div class="value red">¥${result.price_range.max.toFixed(2)}</div>
                    </div>
                    <div class="stat-card">
                        <div class="label">平均价</div>
                        <div class="value">¥${result.avg_price.toFixed(2)}</div>
                    </div>
                    <div class="stat-card">
                        <div class="label">价格差</div>
                        <div class="value">¥${result.price_range.spread.toFixed(2)}</div>
                    </div>
                </div>
            `;

            let highlightHtml = '';
            if (result.cheapest || result.best_value) {
                highlightHtml = '<div class="highlight-cards">';
                if (result.cheapest) {
                    highlightHtml += `
                        <div class="highlight-card cheapest">
                            <span class="badge">💰 最低价</span>
                            <h3>${escapeHtml(result.cheapest.title)}</h3>
                            <div class="price">¥${result.cheapest.price.toFixed(2)}</div>
                            <div class="meta">
                                平台: <span class="platform-tag platform-${result.cheapest.platform}">${result.cheapest.platform}</span>
                                &nbsp;|&nbsp; 店铺: ${escapeHtml(result.cheapest.shop_name)}
                                &nbsp;|&nbsp; 销量: ${result.cheapest.sales}
                            </div>
                        </div>
                    `;
                }
                if (result.best_value) {
                    highlightHtml += `
                        <div class="highlight-card best-value">
                            <span class="badge">⭐ 性价比之选</span>
                            <h3>${escapeHtml(result.best_value.title)}</h3>
                            <div class="price">¥${result.best_value.price.toFixed(2)}</div>
                            <div class="meta">
                                平台: <span class="platform-tag platform-${result.best_value.platform}">${result.best_value.platform}</span>
                                &nbsp;|&nbsp; 评分: <span class="rating-stars">★</span> ${result.best_value.shop_rating}
                                &nbsp;|&nbsp; 销量: ${result.best_value.sales}
                            </div>
                        </div>
                    `;
                }
                highlightHtml += '</div>';
            }

            let chartHtml = `
                <div class="chart-section">
                    <h2>📊 价格对比图表</h2>
                    <div class="chart-grid">
                        <div class="chart-container"><canvas id="priceChart"></canvas></div>
                        <div class="chart-container"><canvas id="platformChart"></canvas></div>
                    </div>
                </div>
                <div class="chart-section">
                    <h2>📈 价格分布与销量关系</h2>
                    <div class="chart-grid">
                        <div class="chart-container"><canvas id="scatterChart"></canvas></div>
                        <div class="chart-container"><canvas id="trendChart"></canvas></div>
                    </div>
                </div>
            `;

            let tableHtml = '<div class="product-list"><h2>📋 商品列表（按价格排序）</h2>';
            tableHtml += '<table><thead><tr>';
            tableHtml += '<th>排名</th><th>平台</th><th>商品名称</th><th>价格</th><th>销量</th><th>评分</th>';
            tableHtml += '</tr></thead><tbody>';

            result.products.slice(0, 30).forEach((p, i) => {
                let tags = '';
                if (p.product_id === cheapestId) {
                    tags += '<span class="recommend-tag recommend-cheapest">最低价</span>';
                }
                if (p.product_id === bestId) {
                    tags += '<span class="recommend-tag recommend-best">推荐</span>';
                }
                tableHtml += `
                    <tr>
                        <td>${i + 1}</td>
                        <td><span class="platform-tag platform-${p.platform}">${p.platform}</span></td>
                        <td>${escapeHtml(p.title)}${tags}</td>
                        <td style="font-weight: 600; color: #ef4444;">¥${p.price.toFixed(2)}</td>
                        <td>${p.sales.toLocaleString()}</td>
                        <td><span class="rating-stars">★</span> ${p.shop_rating.toFixed(1)}</td>
                    </tr>
                `;
            });

            tableHtml += '</tbody></table></div>';

            resultsDiv.innerHTML = statsHtml + highlightHtml + chartHtml + tableHtml;

            if (chartData) {
                renderCharts(chartData);
            } else {
                generateMockCharts(result);
            }
        }

        function renderCharts(chartData) {
            const ctx1 = document.getElementById('priceChart').getContext('2d');
            charts.price = new Chart(ctx1, chartData.price_bar);

            const ctx2 = document.getElementById('platformChart').getContext('2d');
            charts.platform = new Chart(ctx2, chartData.platform_comparison.avg_price_chart);

            const ctx3 = document.getElementById('scatterChart').getContext('2d');
            charts.scatter = new Chart(ctx3, chartData.sales_scatter);

            const ctx4 = document.getElementById('trendChart').getContext('2d');
            charts.trend = new Chart(ctx4, chartData.price_trend);
        }

        function generateMockCharts(result) {
            const labels = result.products.slice(0, 20).map((p, i) => {
                const short = p.title.length > 10 ? p.title.slice(0, 10) + '...' : p.title;
                return `${i+1}. ${short}`;
            });
            const prices = result.products.slice(0, 20).map(p => p.price);
            const colors = result.products.slice(0, 20).map(p => {
                if (p.platform === '京东') return '#e1251b';
                if (p.platform === '淘宝') return '#ff4400';
                return '#e02e24';
            });

            new Chart(document.getElementById('priceChart'), {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '价格 (元)',
                        data: prices,
                        backgroundColor: colors,
                        borderRadius: 4
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        title: { display: true, text: '商品价格排行（从低到高）' }
                    }
                }
            });

            const platforms = Object.keys(result.platform_stats);
            const avgPrices = platforms.map(p => result.platform_stats[p].avg_price);
            const platformColors = ['#e1251b', '#ff4400', '#e02e24'];
            new Chart(document.getElementById('platformChart'), {
                type: 'bar',
                data: {
                    labels: platforms,
                    datasets: [{
                        label: '平均价格 (元)',
                        data: avgPrices,
                        backgroundColor: platformColors.slice(0, platforms.length),
                        borderRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        title: { display: true, text: '各平台平均价格对比' }
                    },
                    scales: { y: { beginAtZero: true } }
                }
            });

            const scatterDatasets = [];
            platforms.forEach((platform, idx) => {
                const pProducts = result.products.filter(p => p.platform === platform);
                scatterDatasets.push({
                    label: platform,
                    data: pProducts.map(p => ({ x: p.price, y: p.sales })),
                    backgroundColor: platformColors[idx],
                    pointRadius: 6
                });
            });
            new Chart(document.getElementById('scatterChart'), {
                type: 'scatter',
                data: { datasets: scatterDatasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        title: { display: true, text: '价格 vs 销量分布' }
                    },
                    scales: {
                        x: { title: { display: true, text: '价格 (元)' } },
                        y: { title: { display: true, text: '销量' } }
                    }
                }
            });

            const trendLabels = [];
            const now = new Date();
            for (let i = 29; i >= 0; i--) {
                const d = new Date(now - i * 86400000);
                trendLabels.push(`${d.getMonth()+1}/${d.getDate()}`);
            }
            const trendDatasets = [];
            const basePrices = { '京东': 3500, '淘宝': 3200, '拼多多': 2800 };
            platforms.forEach((platform, idx) => {
                let price = basePrices[platform] || 3000;
                const data = [];
                for (let i = 0; i < 30; i++) {
                    price += (Math.random() - 0.5) * 100;
                    price = Math.max(price * 0.8, Math.min(price * 1.2, price));
                    data.push(Math.round(price * 100) / 100);
                }
                trendDatasets.push({
                    label: platform,
                    data: data,
                    borderColor: platformColors[idx],
                    backgroundColor: platformColors[idx] + '20',
                    fill: false,
                    tension: 0.4,
                    pointRadius: 2
                });
            });
            new Chart(document.getElementById('trendChart'), {
                type: 'line',
                data: { labels: trendLabels, datasets: trendDatasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        title: { display: true, text: '近30天价格趋势（模拟）' }
                    },
                    scales: {
                        y: { title: { display: true, text: '价格 (元)' } }
                    }
                }
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.getElementById('keywordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') doSearch();
        });
    </script>
</body>
</html>
